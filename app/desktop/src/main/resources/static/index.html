<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/static/">
<title>温言</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- iOS 级折射位移滤镜：边缘色散条纹（仅引用，零面积不占层） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquidRefraction" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.2" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<!-- Web 端玻璃主题增强层（默认关闭，保持现有 UI 为默认） -->
<div class="wy-ambient" id="wyAmbient" hidden>
  <canvas id="wyFluidCanvas"></canvas>
  <div class="wy-ambient-veil"></div>
</div>
<div class="wy-wallpaper" id="wyWallpaper" hidden>
  <img id="wyWallpaperImg" alt="" />
  <div class="wy-wallpaper-veil"></div>
</div>
<div class="wy-fade wy-fade-top" id="wyFadeTop" hidden></div>
<div class="wy-fade wy-fade-bottom" id="wyFadeBottom" hidden></div>

<div id="app">
  <!-- 侧边栏：历史会话 -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <span class="sb-logo">温</span>
      <span style="display:flex;flex-direction:column;gap:1px">
        <span class="sb-name">温言</span>
        <span class="sb-tag">桌面版</span>
      </span>
    </div>
    <div class="sb-new" id="btnNewSession">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建会话
    </div>
    <div class="sb-search"><input type="text" id="sbSearch" placeholder="搜索会话 / 消息" autocomplete="off" style="width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;border:1px solid var(--muted);background:transparent;color:inherit;font-size:12px"></div>
    <div class="sb-list" id="sessionList"></div>
    <div class="sb-foot" id="btnSettings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="color:var(--muted)"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      设置
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar glass edge refract">
      <span class="icon-btn" id="btnToggleSb" title="收起/展开侧栏">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </span>
      <span class="tb-title" id="tbTitle">温言</span>
      <span class="tb-dot" id="tbDot"></span>
      <span class="pill tgt-pill hidden" id="targetPill" title="绑定咨询对象档案（记忆注入）">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        <span class="nm" id="targetName">未绑定档案</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <span class="pill" id="modelPill">
          <span class="sdot" id="modelDot"></span>
          <span class="nm" id="modelName">选择模型</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </span>
        <span class="icon-btn" id="btnTheme" title="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </span>
      </span>
    </div>

    <!-- 聊天视图 -->
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-col" id="chatCol"></div>
    </div>

    <!-- 空状态（v1.8.2 editorial：日期 + 短规则线 + 衬线标题 + 壹贰叁索引） -->
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-editorial">
        <!-- v1.8.2-fix：去掉 .label 类（后定义的 .label 会覆盖 .empty-date 的字号/字距/颜色） -->
        <div class="empty-date" id="mottoDate"></div>
        <hr class="rule-short">
        <h1 class="displayLg empty-title">今天想聊<br>点什么？</h1>
        <div class="empty-index" id="exampleGrid"></div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-zone">
      <div class="pending-thumbs hidden" id="pendingThumbs"></div>
      <div class="input-bar glass edge">
        <span class="input-attach" id="btnAttach" title="上传聊天截图（≤10 张）">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </span>
        <textarea class="input-box" id="inputBox" rows="1" placeholder="说说你的处境…"></textarea>
        <button class="send-btn" id="btnSend" title="发送">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 模型选择弹层 -->
<div class="scrim" id="scrim"></div>
<div class="sheet glass-strong edge refract" id="modelSheet">
  <div class="sheet-head">
    <span class="t" id="sheetTitle">选择模型</span>
    <span class="d" id="sheetDesc">点按切换，实时生效</span>
  </div>
  <div class="sheet-body" id="modelSheetBody"></div>
</div>

<!-- 页面容器（设置 / 厂商编辑 / 记忆档案 / 引导） -->
<div class="page" id="page">
  <div class="topbar glass edge">
    <span class="back-row" id="pageBack">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span id="pageTitle">设置</span>
    </span>
  </div>
  <div class="page-body"><div class="page-col" id="pageCol"></div></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple class="hidden">

<script src="app.js"></script>
</body>
</html>
