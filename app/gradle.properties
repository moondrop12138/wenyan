org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP 增量缓存在本机并发构建下不稳定，禁用（防 Internal compiler error）
ksp.incremental=false
kotlin.incremental=false
# 显式声明 JDK 安装：本机 PATH 的 java 是 JRE21（无 javac），编译用完整 JDK21（用户目录，含 javac）
org.gradle.java.installations.paths=C\:\\Users\\Khalil\\Android\\jdk-21.0.12+8,C\:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot
org.gradle.java.installations.auto-download=false
# 禁用自动探测：PATH 上的 JRE21（jre-21.0.11.10-hotspot，无 javac）会被 toolchain 误选导致 release 编译失败
org.gradle.java.installations.auto-detect=false
