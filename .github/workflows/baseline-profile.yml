# O8: Baseline Profile 生成工作流（独立于主 CI，避免模拟器成本拖慢每个 PR）。
# 触发：手动（workflow_dispatch）或每周日自动跑一次；生成后上传 profile 产物。
# 说明：使用 AGP Managed Device（Pixel 6 / API 34 / aosp-atd），无需 reactivecircus runner。
name: Baseline Profile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

defaults:
  run:
    working-directory: app

jobs:
  generate-baseline-profile:
    name: Generate Baseline Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Generate baseline profile
        run: ./gradlew :benchmark:pixel6Api34BaselineProfile --no-daemon --stacktrace

      - name: Upload generated baseline profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-prof
          path: |
            app/app/src/main/baseline-prof.txt
            app/benchmark/build/outputs/**/*.prof
            app/benchmark/build/outputs/**/*.txt
          if-no-files-found: warn
